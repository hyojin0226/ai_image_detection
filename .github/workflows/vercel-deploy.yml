name: Deploy AI Video to Vercel

on:
  push:
    branches:
      - study/KongDuHyun

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Preview - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: site
            directory: AI_video/deploy/site
            project_id: ${{ vars.VERCEL_SITE_PROJECT_ID || 'prj_SiXAdlXOnCa0OkzKODmdTv4iXqyk' }}
            project_name: duhyeon-ai-video
          - name: cloud
            directory: AI_video/deploy/cloud
            project_id: ${{ vars.VERCEL_CLOUD_PROJECT_ID || 'prj_QoPw0QRcTOEiZVYjLKUe5SyLJrrN' }}
            project_name: duhyeon-ai-video-cloud

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_kCloEe4t0ufwmj8gp3gCnru5' }}
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies (cloud)
        if: matrix.name == 'cloud'
        run: npm ci || npm install

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
          echo "Vercel project linked successfully:"
          echo "  Directory: ${{ matrix.directory }}"
          echo "  Project ID: ${VERCEL_PROJECT_ID:0:6}...${VERCEL_PROJECT_ID: -4} (len: ${#VERCEL_PROJECT_ID})"
          echo "  Org ID:     ${VERCEL_ORG_ID:0:6}...${VERCEL_ORG_ID: -4} (len: ${#VERCEL_ORG_ID})"

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build website
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "### Preview Deployment for ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "URL: $url" >> $GITHUB_STEP_SUMMARY
          echo "Deployed successfully to: $url"
