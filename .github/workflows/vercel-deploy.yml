name: Deploy AI Video to Vercel

on:
  push:
    branches:
      - study/KongDuHyun

permissions:
  contents: read
  checks: write

jobs:
  deploy-preview:
    name: Preview - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: site
            directory: AI_video/deploy/site
            project_id: prj_SiXAdlXOnCa0OkzKODmdTv4iXqyk
            project_name: duhyeon-ai-video
          - name: cloud
            directory: AI_video/deploy/cloud
            project_id: prj_QoPw0QRcTOEiZVYjLKUe5SyLJrrN
            project_name: duhyeon-ai-video-cloud

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_kCloEe4t0ufwmj8gp3gCnru5
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and build tools
        run: |
          pip install --upgrade pip uv
          uv --version

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies (cloud)
        if: matrix.name == 'cloud'
        run: npm ci || npm install

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
          echo "::notice title=Vercel Config (${{ matrix.name }})::Dir=${{ matrix.directory }}, ProjectID=${VERCEL_PROJECT_ID:0:8}..., OrgID=${VERCEL_ORG_ID:0:8}..."

      - name: Pull Vercel settings
        id: pull
        run: |
          if output=$(vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" 2>&1); then
            echo "$output"
            echo "Vercel pull succeeded"
          else
            echo "$output"
            compact_err=$(echo "$output" | tail -c 2000 | tr '\n' ' ')
            echo "::error title=Pull Error (${{ matrix.name }})::$compact_err"
            exit 1
          fi

      - name: Build website
        id: build
        run: |
          if output=$(vercel build --token="$VERCEL_TOKEN" 2>&1); then
            echo "$output"
            echo "Vercel build succeeded"
          else
            echo "$output"
            compact_err=$(echo "$output" | tail -c 2000 | tr '\n' ' ')
            echo "::error title=Build Error (${{ matrix.name }})::$compact_err"
            exit 1
          fi

      - name: Deploy preview
        id: deploy
        run: |
          if deploy_output=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" 2>&1); then
            echo "$deploy_output"
            url=$(echo "$deploy_output" | grep -o 'https://[^ ]*\.vercel\.app' | tail -n 1)
            if [ -z "$url" ]; then
              url=$(echo "$deploy_output" | tail -n 1)
            fi
            echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
            echo "### Preview Deployment for ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
            echo "URL: $url" >> $GITHUB_STEP_SUMMARY
            echo "Deployed successfully to: $url"
            echo "::notice title=Preview Deployed (${{ matrix.name }})::$url"
          else
            echo "$deploy_output"
            compact_err=$(echo "$deploy_output" | tail -c 2000 | tr '\n' ' ')
            echo "::error title=Deploy Error (${{ matrix.name }})::$compact_err"
            exit 1
          fi
