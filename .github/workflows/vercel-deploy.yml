
name: Deploy AI Video to Vercel (Preview)

on:
  push:
    branches:
      - study/KongDuHyun

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Preview - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: site
            directory: AI_video/deploy/site
            project_id: ${{ vars.VERCEL_SITE_PROJECT_ID }}
          - name: cloud
            directory: AI_video/deploy/cloud
            project_id: ${{ vars.VERCEL_CLOUD_PROJECT_ID }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}

    defaults:
      run:
        working-directory: ${{ matrix.directory }}
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment inputs
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'ERROR: VERCEL_TOKEN secret is empty.'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'ERROR: VERCEL_ORG_ID variable is empty.'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'ERROR: Project ID variable is empty.'; exit 1; }
          test -f vercel.json || { echo 'ERROR: Cannot find vercel.json in deployment directory.'; exit 1; }
          echo "Deployment inputs verified."

      - name: Check Vercel API access
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          echo "Vercel project API HTTP status: ${status}"
          case "$status" in
            200) echo 'Project is accessible.' ;;
            401|403) echo 'ERROR: Vercel token permission denied.'; exit 1 ;;
            404) echo 'ERROR: Vercel project not found.'; exit 1 ;;
            *) echo "ERROR: Unexpected HTTP status ${status}."; exit 1 ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python version
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Install uv for Vercel Python builds
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Verify uv installation
        run: uv --version

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview settings
        run: vercel pull --yes --environment=preview

      - name: Build preview
        run: vercel build

      - name: Deploy preview (no production changes)
        run: vercel deploy --prebuilt --archive=tgz
