<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Face Detector</title>
  <meta name="description" content="EfficientNetV2S 기반 AI 생성 얼굴 이미지 판별기 — 브라우저에서 바로 실행됩니다.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1>AI Face Detector</h1>
      <p class="caption">EfficientNetV2S · Accuracy 97.8% · AUC 99.8%</p>
      <p class="lead">얼굴 사진을 올리면 실제 사진인지, AI가 만든 얼굴인지 판별합니다.
        이미지는 서버로 전송되지 않고 이 브라우저 안에서만 분석됩니다.</p>
    </header>

    <section id="model-status" class="status" aria-live="polite">
      <div class="status-row">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">모델 불러오는 중…</span>
      </div>
      <div class="loadbar" id="loadbar"><div id="loadbar-fill"></div></div>
    </section>

    <section class="card">
      <label id="dropzone" class="dropzone" for="file-input" tabindex="0">
        <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <div class="dz-empty" id="dz-empty">
          <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <strong>얼굴 이미지를 끌어다 놓거나 클릭해서 선택</strong>
          <span>JPG, PNG, WEBP</span>
        </div>
        <img id="preview" alt="업로드한 이미지" hidden>
      </label>
      <p class="error" id="error" hidden></p>
    </section>

    <section class="card result" id="result" hidden>
      <div class="analyzing" id="analyzing">
        <span class="spinner"></span> 분석 중…
      </div>
      <div id="result-body" hidden>
        <p class="label-kicker">Prediction</p>
        <h2 id="prediction" class="prediction"></h2>

        <div class="metric">
          <div class="metric-head">
            <span>AI / FAKE 확률</span>
            <span class="num" id="fake-val"></span>
          </div>
          <div class="bar"><div class="bar-fill fake" id="fake-bar"></div></div>
        </div>

        <div class="metric">
          <div class="metric-head">
            <span>REAL 확률</span>
            <span class="num" id="real-val"></span>
          </div>
          <div class="bar">
            <div class="bar-fill real" id="real-bar"></div>
            <div class="threshold" id="threshold-mark" title="REAL 판정 기준선"></div>
          </div>
        </div>

        <p class="small" id="threshold-text"></p>
        <button type="button" class="btn" id="reset">다른 이미지 분석하기</button>
      </div>
    </section>

    <footer class="foot">
      <a href="https://github.com/hyojin0226/ai_image_detection">GitHub</a>
      · 모델 결과는 참고용이며 틀릴 수 있습니다.
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
